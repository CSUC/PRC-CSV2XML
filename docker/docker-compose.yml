services:
  prc-cerif:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: prc-cerif:latest
    container_name: prc-cerif
    environment:
      - SPARK_OPTS=--driver-java-options=-Xmx4g
      - JAVA_OPTS=-Xmx4g
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "spark"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped 